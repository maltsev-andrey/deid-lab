# deid-lab entity catalog v0.1
#
# Single source of truth for WHAT gets removed. Generator, pipelines and
# evaluation all read their labels from here.
#
# category:
#   direct  - identifies a person on its own (name, AHV, phone ...)
#   quasi   - identifies in combination (dates, place, hospital)
# action (planned anonymizer behaviour):
#   pseudonymize - consistent token per document, e.g. <PERSON_1>
#   generalize   - keep coarse value (year only, canton only) - phase 2
#   mask         - fixed token, e.g. <AHV_NUMBER>
#
# Baseline: HIPAA Safe Harbor 18 identifiers, adapted to Swiss documents.
# Open points for the kickoff meeting are marked with "decision:".

version: 0.2

entities:

  PERSON:
    category: direct
    action: pseudonymize
    description: Names of patients, relatives, physicians and staff
    examples: ["Christa Zimmermann", "Mme Josiane Saudan", "Dr. med. Hans Keller"]
    notes: >
      Physician names are included. decision: does the client accept keeping
      treating-physician names? Default here is remove.

  DATE:
    category: quasi
    action: generalize
    description: All dates tied to a person (birth, admission, discharge, exam)
    examples: ["12.03.1957", "4. Mai 2026", "12 mars 1957", "3 giugno 2026"]
    notes: >
      Safe Harbor keeps the year only. The GeMTeX/GraSCCo guideline annotates every
      date expression including bare years ("Z.n. Mamma-Ca 2037") and month/year
      ("11/18"); deid-lab follows GeMTeX so the benchmark numbers are comparable.
      decision: keep bare years for analytics (Safe Harbor) or remove them (GeMTeX)?
      decision: do downstream analytics need intervals (length of stay)? Then use
      date shifting per patient instead of removal.

  AHV_NUMBER:
    category: direct
    action: mask
    description: Swiss social security number (AHVN13), 756.XXXX.XXXX.XC with EAN-13 check digit
    examples: ["756.6395.0418.28"]

  NATIONAL_ID:
    category: direct
    action: mask
    description: Foreign national identifiers (ai4privacy benchmark only, no detector yet)
    examples: ["DE tax id", "FR numéro de sécurité sociale"]
    notes: decision: are non-Swiss patients in scope? Then add per-country validators.

  CREDIT_CARD:
    category: direct
    action: mask
    description: Payment card numbers (ai4privacy benchmark only, no detector yet)
    examples: ["4539 1488 0343 6467"]

  INSURANCE_CARD:
    category: direct
    action: mask
    description: Swiss health insurance card number, 20 digits starting with 80756
    examples: ["80756 01482 93716 20451"]

  PATIENT_ID:
    category: direct
    action: pseudonymize
    description: Hospital patient number, case number, dossier number
    examples: ["PID 10234871", "Fall-Nr. 2026-0418733", "N° de dossier 7730-2241"]
    notes: decision: client-specific formats must be collected from real samples.

  PHONE:
    category: direct
    action: mask
    description: Swiss landline and mobile numbers, national and +41 formats
    examples: ["+41 44 123 45 67", "079 123 45 67", "0041 91 234 56 78"]

  EMAIL:
    category: direct
    action: mask
    description: Personal e-mail addresses
    examples: ["c.zimmermann@bluewin.ch"]

  IBAN:
    category: direct
    action: mask
    description: Swiss bank account numbers (CH IBAN)
    examples: ["CH75 8353 3740 6812 4158 6"]

  STREET_ADDRESS:
    category: direct
    action: mask
    description: Street and house number of a person
    examples: ["Bahnhofstrasse 12", "Avenue de la Gare 7", "Via San Gottardo 14a"]

  LOCATION:
    category: quasi
    action: generalize
    description: Postal code with locality, or locality of residence
    examples: ["8610 Uster", "1950 Sion", "6900 Lugano"]
    notes: decision: keep canton for statistics (generalize) or drop completely.

  ORGANIZATION:
    category: quasi
    action: pseudonymize
    description: Hospital, clinic or practice that treated the patient
    examples: ["Kantonsspital Baden", "Hôpital de Sion", "Ospedale Regionale di Lugano"]
    notes: decision: keep if the cloud use case needs per-site analysis.

# Explicitly NOT personal data. Over-masking these hurts data utility and
# is tracked as false positives in the evaluation.
not_pii:
  - Diagnoses, including eponyms (Morbus Parkinson, maladie de Crohn, tiroidite di Hashimoto)
  - Medication names and dosages
  - ICD-10 codes, lab parameters, reference ranges
  - Health insurer names (CSS, Helsana, Swica) - organisation-level, not patient-level
  - Year on its own, when the Safe Harbor reading is chosen (see DATE)
  - Department names (Klinik für Ophthalmologie) as opposed to institution names
