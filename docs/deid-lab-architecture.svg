<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="1100" height="900" fill="#ffffff"/>

  <!-- title -->
  <text x="550" y="44" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">deid-lab pipeline: rules (A), NER (B), document-level post-processing (_pp)</text>

  <!-- input -->
  <rect x="440" y="76" width="220" height="48" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="550" y="106" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">input text</text>

  <!-- arrows input -> A, B -->
  <path d="M 500 124 L 500 150 L 260 150 L 260 184" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 600 124 L 600 150 L 840 150 L 840 184" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- A box -->
  <rect x="80" y="186" width="360" height="226" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="218" font-size="19" font-weight="700" fill="#1e3a8a">A: Swiss/DE rules</text>
  <text x="100" y="248" font-size="16" fill="#1f2937">regex + validators</text>
  <text x="100" y="276" font-size="16" fill="#1f2937">AHV, insurance card, IBAN</text>
  <text x="100" y="302" font-size="16" fill="#1f2937">phones, patient IDs, dates</text>
  <text x="100" y="328" font-size="16" fill="#1f2937">streets, ZIP + city</text>
  <text x="100" y="354" font-size="16" fill="#1f2937">hospitals, names with titles</text>
  <text x="100" y="392" font-size="14" fill="#6b7280">deidlab/rules.py</text>

  <!-- B box -->
  <rect x="660" y="186" width="360" height="226" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="680" y="218" font-size="19" font-weight="700" fill="#064e3b">B: Presidio + spaCy NER</text>
  <text x="680" y="248" font-size="16" fill="#1f2937">de / fr / it _core_news_lg</text>
  <text x="680" y="276" font-size="16" fill="#1f2937">+ Presidio built-in recognizers</text>
  <text x="680" y="302" font-size="16" fill="#1f2937">+ the same rules A as a recognizer</text>
  <text x="680" y="328" font-size="16" fill="#1f2937">NER spans split at line breaks</text>
  <text x="680" y="354" font-size="16" fill="#1f2937">score threshold 0.35</text>
  <text x="680" y="392" font-size="14" fill="#6b7280">deidlab/pipelines.py</text>

  <!-- arrows A, B -> pp -->
  <path d="M 260 412 L 260 440 L 430 440 L 430 470" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 840 412 L 840 440 L 670 440 L 670 470" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- pp box -->
  <rect x="200" y="472" width="700" height="236" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="220" y="504" font-size="19" font-weight="700" fill="#78350f">post-processing (*_pp)</text>
  <text x="220" y="538" font-size="16" fill="#1f2937"><tspan font-weight="700">1</tspan><tspan dx="10" font-weight="700">deny list</tspan><tspan dx="10">salutations, bare titles, stop words</tspan></text>
  <text x="220" y="568" font-size="16" fill="#1f2937"><tspan font-weight="700">2</tspan><tspan dx="10" font-weight="700">utility filter</tspan><tspan dx="10">on NER spans only: shape checks + clinical vocabulary</tspan></text>
  <text x="220" y="594" font-size="16" fill="#6b7280">    keeps diagnoses, drugs, lab terms, anatomy; profile clinical / generic</text>
  <text x="220" y="624" font-size="16" fill="#1f2937"><tspan font-weight="700">3</tspan><tspan dx="10" font-weight="700">propagation</tspan><tspan dx="10">a value found once (score ≥ 0.7) is masked everywhere in the document</tspan></text>
  <text x="220" y="654" font-size="16" fill="#1f2937"><tspan font-weight="700">4</tspan><tspan dx="10" font-weight="700">person linking</tspan><tspan dx="10">Schwab Vivien / Vivien Schwab / Frau Schwab share one token</tspan></text>
  <text x="220" y="690" font-size="14" fill="#6b7280">deidlab/postprocess.py, deidlab/medical_terms.py</text>

  <!-- arrow pp -> output -->
  <path d="M 550 708 L 550 744" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <!-- output box -->
  <rect x="140" y="746" width="820" height="112" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="160" y="778" font-size="17" font-weight="700" fill="#111827">masked text</text>
  <text x="290" y="778" font-size="16" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" fill="#1f2937">&lt;PERSON_1&gt;  &lt;DATE_2&gt;  &lt;AHV_NUMBER_1&gt;  &lt;PHONE_1&gt; ...</text>
  <text x="160" y="810" font-size="17" font-weight="700" fill="#111827">evaluation</text>
  <text x="290" y="810" font-size="16" fill="#1f2937">against gold spans: recall / precision per entity, language, split</text>
  <text x="290" y="838" font-size="15" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, monospace" fill="#4b5563">leaks.csv   false_positives_top.csv   compare.html   REPORT.md</text>
</svg>
