<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deid-lab compare</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1a1a19; --ink2: #5c5b57; --line: #e2e1dc;
  --accent: #2a78d6; --ok-bg: #d9f2e6; --ok-ink: #0d6b46; --part-bg: #fde9c4; --part-ink: #8a5a00;
  --miss-bg: #fbd5d4; --miss-ink: #a3201f; --chip-bg: #e8eefb; --chip-ink: #1f4f99;
  --fp-ink: #b5480f; --fp-line: #eb6834;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1d1d1c; --ink: #ecebe6; --ink2: #a9a8a0; --line: #33332f;
    --accent: #5b9ae8; --ok-bg: #123d2b; --ok-ink: #7fdcb0; --part-bg: #47360c; --part-ink: #f2c35b;
    --miss-bg: #4a1a19; --miss-ink: #ff9d9b; --chip-bg: #1e2c44; --chip-ink: #a9c6f3;
    --fp-ink: #ffa36b; --fp-line: #d95926; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink2); padding: 5px 10px; cursor: pointer; font: inherit; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: #fff; }
select, input { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 8px; }
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 54px); }
aside { border-right: 1px solid var(--line); overflow-y: auto; max-height: calc(100vh - 54px); position: sticky; top: 54px; }
aside .item { padding: 6px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px;
  font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; border-bottom: 1px solid var(--line); }
aside .item:hover { background: var(--bg); }
aside .item.on { background: var(--chip-bg); color: var(--chip-ink); }
.badges { display: flex; gap: 4px; }
.b { border-radius: 10px; padding: 0 6px; font-size: 11px; }
.b.leak { background: var(--miss-bg); color: var(--miss-ink); }
.b.fp { color: var(--fp-ink); border: 1px solid var(--fp-line); }
main { padding: 14px 16px 40px; min-width: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 14px; color: var(--ink2); margin-bottom: 10px; align-items: center; }
.stats strong { color: var(--ink); }
.nav button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.pane h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink2);
  margin: 0; padding: 8px 12px; border-bottom: 1px solid var(--line); font-weight: 600; }
.pane pre { margin: 0; padding: 12px; white-space: pre-wrap; word-break: break-word;
  font: 12.5px/1.55 ui-monospace, Menlo, Consolas, monospace; }
mark { border-radius: 3px; padding: 0 1px; }
mark.full { background: var(--ok-bg); color: var(--ok-ink); }
mark.part { background: var(--part-bg); color: var(--part-ink); }
mark.miss { background: var(--miss-bg); color: var(--miss-ink); font-weight: 650; }
.chip { background: var(--chip-bg); color: var(--chip-ink); border-radius: 4px; padding: 0 3px; }
.chip.fp { background: transparent; color: var(--fp-ink); outline: 1.5px solid var(--fp-line); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink2); margin-top: 8px; }
.empty { color: var(--ink2); padding: 30px; }
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; max-height: 220px; border-right: 0; border-bottom: 1px solid var(--line); }
  .panes { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">deid-lab compare</h1>
  <div class="seg" id="pipes"></div>
  <select id="filter">
    <option value="all">All documents</option>
    <option value="leak">With leaks</option>
    <option value="fp">With false positives</option>
  </select>
  <select id="lang"></select>
  <input id="q" placeholder="Search id or text" size="18">
</header>
<div class="layout">
  <aside id="list"></aside>
  <main>
    <div class="stats" id="stats"></div>
    <div class="panes">
      <div class="pane"><h2>Input with gold PII</h2><pre id="left"></pre></div>
      <div class="pane"><h2 id="rtitle">Output</h2><pre id="right"></pre></div>
    </div>
    <div class="legend">
      <span><mark class="full">masked</mark> gold span fully masked</span>
      <span><mark class="part">partial</mark> partly masked (leak)</span>
      <span><mark class="miss">missed</mark> not masked (leak)</span>
      <span><span class="chip">&lt;TOKEN&gt;</span> correct mask</span>
      <span><span class="chip fp">&lt;TOKEN&gt;</span> false positive (hover shows original)</span>
      <span>Keys: j / k or arrows to move</span>
    </div>
  </main>
</div>
<script>
const DATA = /*__DATA__*/null;
const META = /*__META__*/null;
let pipe = META.pipelines[META.pipelines.length - 1];
let cur = 0, shown = [];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("title").textContent = "deid-lab compare: " + META.dataset + " (" + DATA.length + " docs)";
const langs = [...new Set(DATA.map(d => d.lang))];
$("lang").innerHTML = '<option value="">All languages</option>' + langs.map(l => `<option>${l}</option>`).join("");

function counts(d, p) {
  const r = d.p[p];
  return { leaks: r.st.filter(s => s < 2).length, fps: r.seg.filter(s => typeof s[1] === "string" && s[2]).length };
}

function renderPipes() {
  $("pipes").innerHTML = META.pipelines.map(p =>
    `<button class="${p === pipe ? "on" : ""}" data-p="${p}">${esc(META.labels[p] || p)}</button>`).join("");
  $("pipes").querySelectorAll("button").forEach(b => b.onclick = () => { pipe = b.dataset.p; refresh(true); });
}

function refresh(keep) {
  const f = $("filter").value, lg = $("lang").value, q = $("q").value.trim().toLowerCase();
  const keepId = keep && shown.length ? DATA[shown[cur]]?.id : null;
  shown = [];
  DATA.forEach((d, i) => {
    if (lg && d.lang !== lg) return;
    if (q && !d.id.toLowerCase().includes(q) && !d.text.toLowerCase().includes(q)) return;
    const c = counts(d, pipe);
    if (f === "leak" && !c.leaks) return;
    if (f === "fp" && !c.fps) return;
    shown.push(i);
  });
  cur = keepId ? Math.max(0, shown.findIndex(i => DATA[i].id === keepId)) : 0;
  renderPipes(); renderList(); renderDoc();
}

function renderList() {
  $("list").innerHTML = shown.map((i, k) => {
    const d = DATA[i], c = counts(d, pipe);
    return `<div class="item ${k === cur ? "on" : ""}" data-k="${k}"><span>${esc(d.id)}</span><span class="badges">` +
      (c.leaks ? `<span class="b leak">${c.leaks}</span>` : "") + (c.fps ? `<span class="b fp">${c.fps}</span>` : "") +
      `</span></div>`;
  }).join("") || '<div class="empty">No documents match.</div>';
  $("list").querySelectorAll(".item").forEach(el => el.onclick = () => { cur = +el.dataset.k; renderList(); renderDoc(); });
  const on = $("list").querySelector(".item.on"); if (on) on.scrollIntoView({ block: "nearest" });
}

function renderDoc() {
  if (!shown.length) { $("left").textContent = ""; $("right").textContent = ""; $("stats").textContent = ""; return; }
  const d = DATA[shown[cur]], r = d.p[pipe], c = counts(d, pipe);
  // left: original with gold status
  const order = d.gold.map((g, i) => [g, r.st[i]]).sort((a, b) => a[0][0] - b[0][0]);
  let html = "", pos = 0;
  for (const [[a, b, lab], st] of order) {
    if (a < pos) continue;
    html += esc(d.text.slice(pos, a));
    const cls = st === 2 ? "full" : st === 1 ? "part" : "miss";
    html += `<mark class="${cls}" title="${esc(lab)}">${esc(d.text.slice(a, b))}</mark>`;
    pos = b;
  }
  $("left").innerHTML = html + esc(d.text.slice(pos));
  // right: masked output, leaked gold text highlighted inside untouched segments
  const leaks = order.filter(([g, st]) => st < 2).map(([g]) => g);
  let out = "";
  for (const s of r.seg) {
    if (typeof s[1] === "string") {
      out += `<span class="chip ${s[2] ? "fp" : ""}" title="${esc(s[0])}">${esc(s[1])}</span>`;
    } else {
      const a0 = s[1], text = s[0];
      let p = 0;
      for (const [a, b] of leaks) {
        const x = Math.max(a, a0) - a0, y = Math.min(b, a0 + text.length) - a0;
        if (y > x && x >= p) { out += esc(text.slice(p, x)) + `<mark class="miss">${esc(text.slice(x, y))}</mark>`; p = y; }
      }
      out += esc(text.slice(p));
    }
  }
  $("right").innerHTML = out;
  $("rtitle").textContent = "Output: " + (META.labels[pipe] || pipe);
  $("stats").innerHTML =
    `<span class="nav"><button id="prev">Prev</button> <button id="next">Next</button></span>` +
    `<span><strong>${esc(d.id)}</strong> ${cur + 1} / ${shown.length}</span>` +
    `<span>gold <strong>${d.gold.length}</strong></span>` +
    `<span>leaks <strong>${c.leaks}</strong></span>` +
    `<span>false positives <strong>${c.fps}</strong></span>`;
  $("prev").onclick = () => move(-1); $("next").onclick = () => move(1);
}

function move(k) { if (!shown.length) return; cur = (cur + k + shown.length) % shown.length; renderList(); renderDoc(); }
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "j" || e.key === "ArrowDown" || e.key === "ArrowRight") { move(1); e.preventDefault(); }
  if (e.key === "k" || e.key === "ArrowUp" || e.key === "ArrowLeft") { move(-1); e.preventDefault(); }
});
["filter", "lang"].forEach(id => $(id).onchange = () => refresh(false));
$("q").oninput = () => refresh(false);
refresh(false);
</script>
</body>
</html>
